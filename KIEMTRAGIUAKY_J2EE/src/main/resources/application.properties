spring.application.name=courseregistration
spring.datasource.url=jdbc:mysql://localhost:3306/course_registration?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run on a free port to avoid conflicts
server.port=8084

logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=DEBUG

# Google OAuth2 Credentials (replace with actual client ID and secret and uncomment)
spring.security.oauth2.client.registration.google.client-id=mock-client-id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
spring.security.oauth2.client.registration.google.scope=profile, email

