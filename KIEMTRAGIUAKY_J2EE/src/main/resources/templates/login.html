<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head('Login')}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout :: navbar}"></th:block>

    <div class="container py-5 animate-fade-in">
        <div class="row justify-content-center header-row">
            <div class="col-md-7 col-lg-5">
                <div class="card auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle" style="font-size: 4rem; color: var(--brand-color);"></i>
                        <h2 class="fw-bold mt-2" style="color: #1f2937;">Welcome Back</h2>
                        <p class="text-muted">Enter your details to access your account.</p>
                    </div>
                    
                    <div th:if="${param.error}" class="alert alert-danger rounded-3 fw-medium d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-3 fw-medium d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> You have been safely logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control bg-light" id="username" name="username" placeholder="Username" required>
                            <label for="username"><i class="bi bi-person me-1"></i> Username</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control bg-light" id="password" name="password" placeholder="Password" required>
                            <label for="password"><i class="bi bi-lock me-1"></i> Password</label>
                        </div>
                        
                        <button class="btn btn-brand w-100 py-3 mb-3 fs-5" type="submit">Log in to Account</button>
                    </form>
                    
                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1" style="opacity: 0.15;">
                        <span class="mx-3 text-muted fw-bold small">OR CONTINUE WITH</span>
                        <hr class="flex-grow-1" style="opacity: 0.15;">
                    </div>

                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-light border w-100 py-3 fw-bold d-flex align-items-center justify-content-center shadow-sm" style="border-radius: 50px; transition: 0.2s;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-google me-2 text-danger" viewBox="0 0 16 16">
                            <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"/>
                        </svg>
                        Google
                    </a>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Don't have an account? <a th:href="@{/register}" class="fw-bold text-decoration-none" style="color: var(--brand-color);">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Small hover effects specific to this page -->
    <style>
        .btn-light:hover { background-color: #f9fafb !important; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05) !important; }
    </style>

    <th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
