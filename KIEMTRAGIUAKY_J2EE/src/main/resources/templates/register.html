<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head('Register')}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout :: navbar}"></th:block>

    <div class="container py-5 animate-fade-in">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill" style="font-size: 4rem; color: var(--brand-color);"></i>
                        <h2 class="fw-bold mt-2" style="color: #1f2937;">Create an Account</h2>
                        <p class="text-muted">Start learning with world-class universities.</p>
                    </div>

                    <form th:action="@{/register}" th:object="${student}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control bg-light" id="username" th:field="*{username}" placeholder="Username" required>
                            <label for="username"><i class="bi bi-person"></i> Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control bg-light" id="email" th:field="*{email}" placeholder="Email" required>
                            <label for="email"><i class="bi bi-envelope"></i> Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control bg-light" id="password" th:field="*{password}" placeholder="Password" required>
                            <label for="password"><i class="bi bi-lock"></i> Password</label>
                        </div>
                        
                        <button class="btn btn-brand w-100 py-3 fs-5" type="submit">Sign Up Now</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already have an account? <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--brand-color);">Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
