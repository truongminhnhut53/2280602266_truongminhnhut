<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang nhap</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 14px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
        }
        .btn-primary {
            background: #667eea;
            border-color: #667eea;
        }
        .btn-primary:hover {
            background: #546de5;
            border-color: #546de5;
        }
    </style>
</head>
<body>
<div class="card login-card">
    <div class="card-body p-4 p-md-5">
        <h3 class="text-center mb-3">Dang nhap he thong</h3>
        <p class="text-center text-muted mb-4">Phan quyen USER/ADMIN</p>

        <div class="alert alert-danger" th:if="${param.error}">
            Sai ten dang nhap hoac mat khau.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            Ban da dang xuat thanh cong.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Ten dang nhap</label>
                <input class="form-control" id="username" name="username" type="text" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mat khau</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Dang nhap</button>
        </form>

        <div class="text-muted mt-4" style="font-size: 0.9rem;">
            Tai khoan co san: <code>admin</code> (ADMIN), <code>user</code> (USER)
        </div>
    </div>
</div>
</body>
</html>
